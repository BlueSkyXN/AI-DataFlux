# AI-DataFlux 4.0 canonical configuration example.
#
# This file is intentionally incompatible with every 3.x configuration.  A
# deployment may keep only the component sections it needs, but runtime and
# schema_version are always required.

schema_version: 4

runtime:
  log:
    level: info
    format: text
    output: console
    file_path: ./logs/ai_dataflux.log
  auth:
    token: "" # DATAFLUX_TOKEN takes precedence
  workspace:
    roots:
      project: .
    state_dir: ./.dataflux/jobs
  scheduler:
    max_active_jobs: auto
    cpu_high_watermark: 85
    memory_high_watermark: 80
    min_free_memory_mb: 512
    sample_interval_seconds: 2
  token_estimation:
    mode: io
    sample_size: -1
    encoding: o200k_base

job:
  gateway_url: http://127.0.0.1:8787
  datasource:
    type: excel
    input_path: ./data/input.xlsx
    output_path: ./data/output.xlsx
    engine: auto
    reader: auto
    writer: auto
    require_all_input_fields: true
  columns:
    extract:
      - question
      - context
    write:
      answer: ai_answer
      category: ai_category
      confidence: ai_confidence
      sentiment: ai_sentiment
  model_selection:
    mode: auto
  prompt:
    required_fields:
      - answer
      - category
      - confidence
      - sentiment
    use_json_schema: true
    temperature: 0.3
    temperature_override: true
    system_prompt: |
      你是一个专业的数据分析师。请只根据输入记录生成结构化结果。
    template: |
      请分析以下记录并返回 JSON：

      {record_json}
  validation:
    enabled: true
    field_rules:
      category:
        - technical
        - business
        - general
      sentiment:
        - positive
        - neutral
        - negative
  routing:
    enabled: false
  concurrency:
    batch_size: 100
    max_in_flight: 100
    save_interval: 300
    shard_size: 10000
    min_shard_size: 1000
    max_shard_size: 50000
    max_connections: 1000
    max_connections_per_host: 0
  retry:
    task_max_attempts:
      api_error: 4
      content_error: 2
      system_error: 3
      source_error: 3
    model_max_attempts: 3
    api_pause_duration_seconds: 2
    api_error_trigger_window_seconds: 2
  writeback:
    commit_max_attempts: 3
    reconciliation_max_attempts: 3
    backoff_initial_seconds: 1
    backoff_max_seconds: 30

gateway:
  listen:
    host: 127.0.0.1
    port: 8787
    workers: 1
  connection_pool:
    max_connections: 1000
    max_connections_per_host: 1000
  channels:
    openai:
      base_url: https://api.openai.com
      endpoints:
        chat_completions: /v1/chat/completions
        responses: /v1/responses
      timeout_seconds: 300
      proxy: ""
      ssl_verify: true
      ip_pool: []
  routes:
    - id: model-1
      display_name: model-1
      aliases: []
      upstream_model: gpt-4-turbo
      channel_id: openai
      api_key: your_api_key
      capabilities:
        - chat_completions
        - responses
        - stream
        - multimodal
        - tools
        - n
        - json_schema
        - logprobs
        - previous_response_id
      weight: 10
      safe_rps: 5
      timeout_seconds: 300
      temperature: 0.3
  fallback_groups: {}
  retry:
    max_attempts_per_request: 3
  affinity:
    ttl_seconds: 3600
    max_entries: 10000

control:
  listen:
    host: 127.0.0.1
    port: 8790

# Routing profiles are separate local YAML files. They do not contain
# schema_version and may only contain partial prompt and validation sections.
#
