# =============================================================================
# 测试工作流 — 代码质量检查 + 多平台单元测试 + 集成测试
#
# 触发条件:
#   - 推送到主分支且修改了源码/测试/依赖文件
#   - Pull Request 修改了源码/测试/Python 文件
#   - 手动触发（可运行集成测试）
#
# 任务组成:
#   1. lint         — 固定版本的 Ruff + Black + 阻断式 mypy + 语法检查
#   2. coverage     — 含 Gateway 的单元测试覆盖率门禁
#   3. security     — pip-audit 依赖审计
#   4. frontend     — lint / Vitest / Playwright E2E / build / npm audit
#   5. unit-tests   — 多平台多版本单元测试矩阵
#   6. cli-test / perf-libs / integration-test
# =============================================================================
name: Test

on:
  push:
    branches: [main, master, dev]
    paths:                                 # 仅在相关文件变更时触发
      - 'src/**'
      - 'tests/**'
      - 'cli.py'
      - 'main.py'
      - 'gateway.py'
      - 'requirements.txt'
      - 'requirements-*.txt'
      - '.coveragerc'
      - 'web/**'
      - '.github/scripts/**'
      - 'config-example.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - 'requirements*.txt'
      - '.coveragerc'
      - 'web/**'
      - '.github/scripts/**'
      - 'config-example.yaml'
      - '.github/workflows/test.yml'
  workflow_dispatch:                       # 手动触发（可运行集成测试）

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'                # 确保跨平台 Python I/O 编码一致

jobs:
  # =========================================================================
  # 代码质量检查 — Ruff 静态检查 + Black 格式检查 + mypy 类型检查 + 语法检查
  # =========================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src/ tests/ cli.py main.py gateway.py

      - name: Run Black (check)
        run: black --check src/ tests/ cli.py main.py gateway.py

      - name: Type check (blocking)
        run: mypy src/ --ignore-missing-imports

      - name: Syntax check                         # 确保所有 Python 文件语法正确
        run: |
          python -m py_compile cli.py main.py gateway.py
          find src -name "*.py" -exec python -m py_compile {} \;

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run non-integration coverage gate
        run: >-
          pytest tests/ -v -m "not integration" --tb=short
          --cov=src --cov-branch --cov-report=xml --cov-report=json
          --cov-report=term-missing
      - name: Enforce overall and critical-module coverage thresholds
        run: python .github/scripts/check_coverage.py coverage.json
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  security:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install pinned pip-audit
        run: python -m pip install "pip-audit==2.9.0"
      - name: Audit Python runtime requirements
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend E2E
        run: npm run test:e2e
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  # =========================================================================
  # 单元测试矩阵 — 覆盖 7 个 OS × 5 个 Python 版本（含 ARM 架构）
  # 测试平台: Ubuntu 22.04/24.04(x64+ARM), Windows 2022/2025, macOS 15(Intel+ARM), macOS 26
  # Python 版本: 3.10 ~ 3.14
  # =========================================================================
  # 单元测试
  unit-tests:
    name: Py ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04
          - { os: ubuntu-22.04, python: '3.10' }
          - { os: ubuntu-22.04, python: '3.11' }
          - { os: ubuntu-22.04, python: '3.12' }
          - { os: ubuntu-22.04, python: '3.13' }
          - { os: ubuntu-22.04, python: '3.14' }
          # Ubuntu 24.04
          - { os: ubuntu-24.04, python: '3.10' }
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: ubuntu-24.04, python: '3.12' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: ubuntu-24.04, python: '3.14' }
          # Ubuntu 24.04 ARM
          - { os: ubuntu-24.04-arm, python: '3.10', arch: 'arm64' }
          - { os: ubuntu-24.04-arm, python: '3.11', arch: 'arm64' }
          - { os: ubuntu-24.04-arm, python: '3.12', arch: 'arm64' }
          - { os: ubuntu-24.04-arm, python: '3.13', arch: 'arm64' }
          - { os: ubuntu-24.04-arm, python: '3.14', arch: 'arm64' }
          # Windows Server 2022
          - { os: windows-2022, python: '3.10' }
          - { os: windows-2022, python: '3.11' }
          - { os: windows-2022, python: '3.12' }
          - { os: windows-2022, python: '3.13' }
          - { os: windows-2022, python: '3.14' }
          # Windows Server 2025
          - { os: windows-2025, python: '3.10' }
          - { os: windows-2025, python: '3.11' }
          - { os: windows-2025, python: '3.12' }
          - { os: windows-2025, python: '3.13' }
          - { os: windows-2025, python: '3.14' }
          # macOS 15 Intel
          - { os: macos-15-intel, python: '3.10', arch: 'x64' }
          - { os: macos-15-intel, python: '3.11', arch: 'x64' }
          - { os: macos-15-intel, python: '3.12', arch: 'x64' }
          - { os: macos-15-intel, python: '3.13', arch: 'x64' }
          - { os: macos-15-intel, python: '3.14', arch: 'x64' }
          # macOS 15 ARM
          - { os: macos-15, python: '3.11', arch: 'arm64' }
          - { os: macos-15, python: '3.12', arch: 'arm64' }
          - { os: macos-15, python: '3.13', arch: 'arm64' }
          - { os: macos-15, python: '3.14', arch: 'arm64' }
          # macOS 26
          - { os: macos-26, python: '3.11' }
          - { os: macos-26, python: '3.12' }
          - { os: macos-26, python: '3.13' }
          - { os: macos-26, python: '3.14' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch || 'x64' }}
          allow-prereleases: true
          cache: 'pip'

      - name: Install core dependencies            # 安装核心依赖和测试框架
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-dev.txt

      - name: Install optional dependencies        # 安装可选性能依赖（允许失败，某些平台可能缺少预编译 wheel）
        # 部分平台可能缺少某些依赖的预编译 wheel，允许失败
        continue-on-error: true
        run: |
          python -m pip install -r requirements-optional.txt

      - name: Verify dependencies availability      # 运行依赖检查脚本
        run: python .github/scripts/check_deps.py

      - name: Run unit tests
        run: pytest tests/ -v -m "not integration" --tb=short

  # =========================================================================
  # CLI 功能测试 — 验证所有 CLI 命令正常工作
  # =========================================================================
  # CLI 功能测试
  cli-test:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test CLI                             # 测试所有 CLI 子命令和配置验证
        run: |
          python cli.py version
          python cli.py check
          python cli.py --help
          python cli.py process --help
          python cli.py gateway --help
          python cli.py gui --help
          python cli.py process --config config-example.yaml --validate

  # =========================================================================
  # 高性能库测试 — 验证 Polars/fastexcel/xlsxwriter 等可选库的集成
  # =========================================================================
  # 高性能库测试
  perf-libs:
    name: Performance Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install all dependencies
        run: python -m pip install -r requirements.txt

      - name: Check library availability
        run: python cli.py check

      - name: Test engine factory
        run: |
          python -c "
          from src.data.engines import get_engine, get_available_libraries, POLARS_AVAILABLE

          libs = get_available_libraries()
          print('Available libraries:', {k: v for k, v in libs.items() if v})

          # Test pandas engine
          engine = get_engine('pandas', 'auto', 'auto')
          print(f'PandasEngine: reader={engine.excel_reader}, writer={engine.excel_writer}')

          # Test auto engine
          engine = get_engine('auto', 'auto', 'auto')
          print(f'Auto selected: {engine.name}')

          # Test polars if available
          if POLARS_AVAILABLE:
              engine = get_engine('polars')
              print(f'PolarsEngine: {engine.name}')
          "

  # =========================================================================
  # 集成测试 — 在 PR/push/手动触发时运行
  # MySQL/PostgreSQL 使用本 job 的一次性 service containers，不读取外部数据库。
  # =========================================================================
  # 集成测试
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dataflux_root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: dataflux
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataflux
          POSTGRES_PASSWORD: dataflux
          POSTGRES_DB: dataflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dataflux -d dataflux"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATAFLUX_DB_INTEGRATION: '1'
      DATAFLUX_MYSQL_HOST: 127.0.0.1
      DATAFLUX_MYSQL_PORT: '3306'
      DATAFLUX_MYSQL_DATABASE: dataflux
      DATAFLUX_MYSQL_ROOT_PASSWORD: dataflux_root
      DATAFLUX_POSTGRES_HOST: 127.0.0.1
      DATAFLUX_POSTGRES_PORT: '5432'
      DATAFLUX_POSTGRES_USER: dataflux
      DATAFLUX_POSTGRES_PASSWORD: dataflux
      DATAFLUX_POSTGRES_DATABASE: dataflux
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/ -v -m "integration" --tb=short
