# =============================================================================
# PyInstaller 构建工作流 — 将 Python 打包为单文件可执行程序
#
# 触发条件:
#   - 推送 SemVer 标签时（如 3.2.0 或 v3.2.0，创建 Release）
#   - 推送到主分支且修改了源码/依赖/前端文件
#   - Pull Request 修改了相关文件
#   - 手动触发（可指定版本号）
#
# 构建产物（两种变体）:
#   - Full 版: 包含 Web GUI 控制面板（web/dist），适合需要图形界面的用户
#   - CLI-only 版: 仅命令行工具，体积更小，适合服务器部署
#
# 支持平台: Linux (amd64/arm64)、macOS (arm64)、Windows (amd64)
# =============================================================================
name: Build with PyInstaller

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'          # 兼容 v3.2.0 形式
      - '[0-9]*.[0-9]*.[0-9]*'           # 兼容历史 3.2.0 形式
    branches:
      - main
      - master
      - dev
    paths:                                 # 仅在相关文件变更时触发
      - 'src/**'
      - 'cli.py'
      - 'main.py'
      - 'gateway.py'
      - 'requirements.txt'
      - 'config-example.yaml'
      - 'web/**'
      - '.github/scripts/smoke_control.py'
      - '.github/workflows/build-pyinstaller.yml'
  pull_request:
    paths:
      - 'src/**'
      - '*.py'
      - 'config-example.yaml'
      - 'web/**'
      - '.github/scripts/smoke_control.py'
      - '.github/workflows/build-pyinstaller.yml'
  workflow_dispatch:                       # 支持手动触发
    inputs:
      version:
        description: 'Version tag for release (e.g., 3.2.0 or v3.2.0)'
        required: false
        default: ''

# 全局环境变量
env:
  APP_NAME: AI-DataFlux
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # =========================================================================
  # 构建任务 — 跨平台打包（Full + CLI-only 两种变体）
  # =========================================================================
  build:
    name: Build ${{ matrix.build_type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                     # 某平台/变体失败不影响其他继续构建
      matrix:
        include:
          # Full 版本（包含 Web GUI 控制面板）
          - os: ubuntu-24.04
            build_type: full
            artifact_name: AI-DataFlux-linux-amd64-full
          - os: ubuntu-24.04-arm
            build_type: full
            artifact_name: AI-DataFlux-linux-arm64-full
          - os: macos-15
            build_type: full
            artifact_name: AI-DataFlux-macos-arm64-full
          - os: windows-2025
            build_type: full
            artifact_name: AI-DataFlux-windows-amd64-full.exe

          # CLI-only 版本（不含 Web GUI，体积更小）
          - os: ubuntu-24.04
            build_type: cli-only
            artifact_name: AI-DataFlux-linux-amd64-cli
          - os: ubuntu-24.04-arm
            build_type: cli-only
            artifact_name: AI-DataFlux-linux-arm64-cli
          - os: macos-15
            build_type: cli-only
            artifact_name: AI-DataFlux-macos-arm64-cli
          - os: windows-2025
            build_type: cli-only
            artifact_name: AI-DataFlux-windows-amd64-cli.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 前端构建（仅 Full 版本需要）---
      - name: Set up Node.js
        if: matrix.build_type == 'full'    # CLI-only 版本跳过前端构建
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Validate and build frontend
        if: matrix.build_type == 'full'
        run: |
          cd web
          npm ci
          npm run lint
          npm run test
          npm audit --audit-level=high
          npm run build

      # --- Python 环境与依赖 ---
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies        # 安装运行时依赖 + PyInstaller 打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.19.0 pip-audit==2.9.0

      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt

      # --- 构建前验证 ---
      - name: Verify CLI
        run: |
          python cli.py version
          python cli.py check

      # --- PyInstaller 打包（区分 Full/CLI-only 和平台）---
      - name: Build with PyInstaller (Unix - Full)
        if: runner.os != 'Windows' && matrix.build_type == 'full'
        shell: bash
        run: |
          pyinstaller --onefile --clean --name ${{ env.APP_NAME }} --add-data "web/dist:web/dist" cli.py

      - name: Build with PyInstaller (Unix - CLI-only)
        if: runner.os != 'Windows' && matrix.build_type == 'cli-only'
        shell: bash
        run: |
          # Remove web/dist if exists to ensure CLI version doesn't include any frontend assets
          rm -rf web/dist || true
          pyinstaller --onefile --clean --name ${{ env.APP_NAME }} --exclude-module=src.control.server cli.py

      - name: Build with PyInstaller (Windows - Full)
        if: runner.os == 'Windows' && matrix.build_type == 'full'
        shell: pwsh
        run: |
          pyinstaller --onefile --clean --name ${{ env.APP_NAME }} --add-data "web/dist;web/dist" cli.py

      - name: Build with PyInstaller (Windows - CLI-only)
        if: runner.os == 'Windows' && matrix.build_type == 'cli-only'
        shell: pwsh
        run: |
          # Remove web/dist if exists to ensure CLI version doesn't include any frontend assets
          if (Test-Path "web/dist") { Remove-Item -Recurse -Force "web/dist" }
          pyinstaller --onefile --clean --name ${{ env.APP_NAME }} --exclude-module=src.control.server cli.py

      # --- 重命名并上传构建产物 ---
      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv dist/${{ env.APP_NAME }} dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          move dist\${{ env.APP_NAME }}.exe dist\${{ matrix.artifact_name }}

      - name: Smoke packaged binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DATAFLUX_TOKEN: packaged-control-smoke-token
        run: |
          artifact="dist/${{ matrix.artifact_name }}"
          chmod +x "$artifact"
          "$artifact" version
          "$artifact" --help
          "$artifact" check
          "$artifact" process --config config-example.yaml --validate
          "$artifact" config validate --config config-example.yaml --json
          "$artifact" worker --help
          "$artifact" job --help
          "$artifact" job list --config config-example.yaml --json
          if [ "${{ matrix.build_type }}" = "full" ]; then
            "$artifact" gui --help
            port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
            "$artifact" gui --config config-example.yaml --host 127.0.0.1 --port "$port" --no-browser > control-smoke.stdout.log 2> control-smoke.stderr.log &
            control_pid=$!
            cleanup_control() {
              if kill -0 "$control_pid" 2>/dev/null; then
                kill "$control_pid" 2>/dev/null || true
              fi
              wait "$control_pid" 2>/dev/null || true
            }
            trap cleanup_control EXIT
            if ! python .github/scripts/smoke_control.py "http://127.0.0.1:${port}/health" --timeout 60; then
              sed -n '1,200p' control-smoke.stdout.log
              sed -n '1,200p' control-smoke.stderr.log >&2
              exit 1
            fi
            cleanup_control
            trap - EXIT
          elif "$artifact" gui --help > /tmp/dataflux-gui-help.txt 2>&1; then
            echo "CLI-only artifact unexpectedly exposes gui"
            exit 1
          fi

      - name: Smoke packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATAFLUX_TOKEN: packaged-control-smoke-token
        run: |
          $artifact = "dist\${{ matrix.artifact_name }}"
          & $artifact version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact process --config config-example.yaml --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact config validate --config config-example.yaml --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact worker --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact job --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact job list --config config-example.yaml --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.build_type }}" -eq "full") {
            & $artifact gui --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            $listener.Stop()
            $stdoutLog = "control-smoke.stdout.log"
            $stderrLog = "control-smoke.stderr.log"
            $control = Start-Process -FilePath $artifact -ArgumentList @("gui", "--config", "config-example.yaml", "--host", "127.0.0.1", "--port", "$port", "--no-browser") -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
            try {
              python .github/scripts/smoke_control.py "http://127.0.0.1:$port/health" --timeout 60
              if ($LASTEXITCODE -ne 0) {
                Get-Content $stdoutLog -ErrorAction SilentlyContinue
                Get-Content $stderrLog -ErrorAction SilentlyContinue | Write-Error
                exit $LASTEXITCODE
              }
            } finally {
              if (-not $control.HasExited) {
                Stop-Process -Id $control.Id -Force -ErrorAction SilentlyContinue
              }
              Wait-Process -Id $control.Id -ErrorAction SilentlyContinue
            }
          } else {
            & $artifact gui --help *> smoke-gui-help.txt
            if ($LASTEXITCODE -eq 0) {
              Write-Error "CLI-only artifact unexpectedly exposes gui"
              exit 1
            }
          }

      - name: Upload artifact               # 上传到 GitHub Artifacts，保留30天
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  # =========================================================================
  # 发布任务 — 仅在推送版本标签时触发
  # =========================================================================
  release:
    name: Create Release
    needs: build                           # 等待所有平台和变体构建完成
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # 仅上述 SemVer 标签触发
    
    steps:
      - name: Download all artifacts       # 下载所有平台的构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display artifacts            # 列出所有下载的文件用于确认
        run: find artifacts/ -type f

      - name: Create GitHub Release        # 创建 Release 并上传所有构建产物
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body: |
            ## ${{ env.APP_NAME }} ${{ github.ref_name }}

            ### Downloads

            **完整版（Full - 包含 Web GUI）：**
            - **Linux (x64)**: `AI-DataFlux-linux-amd64-full`
            - **Linux (ARM64)**: `AI-DataFlux-linux-arm64-full`
            - **macOS (Apple Silicon)**: `AI-DataFlux-macos-arm64-full`
            - **Windows (x64)**: `AI-DataFlux-windows-amd64-full.exe`

            **CLI 版本（仅命令行，体积更小）：**
            - **Linux (x64)**: `AI-DataFlux-linux-amd64-cli`
            - **Linux (ARM64)**: `AI-DataFlux-linux-arm64-cli`
            - **macOS (Apple Silicon)**: `AI-DataFlux-macos-arm64-cli`
            - **Windows (x64)**: `AI-DataFlux-windows-amd64-cli.exe`

            ### Build Info
            - Builder: PyInstaller
            - Python: ${{ env.PYTHON_VERSION }}
            - Node.js: ${{ env.NODE_VERSION }} (Full 版)

            ### 版本说明
            - **Full 版**：包含 Web GUI 控制面板、配置编辑器、实时日志查看
            - **CLI 版**：仅包含命令行工具（process、gateway、token 等），体积更小
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
