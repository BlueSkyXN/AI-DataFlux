# =============================================================================
# Nuitka 构建工作流 — 将 Python 编译为原生机器码
#
# 触发条件:
#   - 推送 SemVer 标签时（如 3.2.0 或 v3.2.0，创建 Release）
#   - 推送到主分支且修改了源码/依赖/前端文件
#   - Pull Request 修改了相关文件
#   - 手动触发（可指定版本号）
#
# 构建产物:
#   - Linux (amd64/arm64)、macOS (arm64)、Windows (amd64) 单文件可执行程序
#   - 始终包含 Web GUI 控制面板（web/dist）
#
# 与 PyInstaller 构建的区别:
#   - Nuitka 编译为原生机器码，启动更快、运行性能更好
#   - 仅构建完整版（含 GUI），不区分 cli-only 版本
# =============================================================================
name: Build with Nuitka

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'          # 兼容 v3.2.0 形式
      - '[0-9]*.[0-9]*.[0-9]*'           # 兼容历史 3.2.0 形式
    branches:
      - main
      - master
      - dev
    paths:                                 # 仅在相关文件变更时触发
      - 'src/**'
      - 'cli.py'
      - 'main.py'
      - 'gateway.py'
      - 'requirements.txt'
      - 'config-example.yaml'
      - 'web/**'
      - '.github/scripts/smoke_control.py'
      - '.github/workflows/build-nuitka.yml'
  pull_request:
    paths:
      - 'src/**'
      - '*.py'
      - 'config-example.yaml'
      - 'web/**'
      - '.github/scripts/smoke_control.py'
      - '.github/workflows/build-nuitka.yml'
  workflow_dispatch:                       # 支持手动触发
    inputs:
      version:
        description: 'Version tag for release (e.g., 3.2.0 or v3.2.0)'
        required: false
        default: ''

# 全局环境变量
env:
  APP_NAME: AI-DataFlux
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # =========================================================================
  # 构建任务 — 跨平台编译
  # =========================================================================
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                     # 某平台失败不影响其他平台继续构建
      matrix:
        include:
          # Linux x64
          - os: ubuntu-24.04
            artifact_name: AI-DataFlux-nuitka-linux-amd64
            asset_name: AI-DataFlux-nuitka-linux-amd64
          # Linux ARM64
          - os: ubuntu-24.04-arm
            artifact_name: AI-DataFlux-nuitka-linux-arm64
            asset_name: AI-DataFlux-nuitka-linux-arm64
          # macOS Apple Silicon
          - os: macos-15
            artifact_name: AI-DataFlux-nuitka-macos-arm64
            asset_name: AI-DataFlux-nuitka-macos-arm64
          # Windows x64
          - os: windows-2025
            artifact_name: AI-DataFlux-nuitka-windows-amd64.exe
            asset_name: AI-DataFlux-nuitka-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 前端构建 ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Validate and build frontend
        run: |
          cd web
          npm ci
          npm run lint
          npm run test
          npm audit --audit-level=high
          npm run build

      # --- Python 环境与依赖 ---
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies        # 安装运行时依赖 + Nuitka 编译工具链
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard pip-audit==2.9.0

      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt

      # --- 平台特定的 C 编译器安装 ---
      - name: Install C compiler (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf

      - name: Install C compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select --install || true

      # --- 构建前验证 ---
      - name: Verify CLI
        run: |
          python cli.py version
          python cli.py check

      # --- Nuitka 编译（打包为单文件可执行程序）---
      - name: Build with Nuitka (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --standalone \
            --assume-yes-for-downloads \
            --include-data-dir=web/dist=web/dist \
            --output-filename=${{ env.APP_NAME }} \
            --output-dir=dist \
            cli.py

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka --onefile --standalone --assume-yes-for-downloads --include-data-dir=web/dist=web/dist --output-filename=${{ env.APP_NAME }}.exe --output-dir=dist cli.py

      # --- 重命名并上传构建产物 ---
      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv dist/${{ env.APP_NAME }} dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          move dist\${{ env.APP_NAME }}.exe dist\${{ matrix.artifact_name }}

      - name: Smoke packaged binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DATAFLUX_TOKEN: packaged-control-smoke-token
        run: |
          artifact="dist/${{ matrix.artifact_name }}"
          chmod +x "$artifact"
          "$artifact" version
          "$artifact" --help
          "$artifact" check
          "$artifact" process --config config-example.yaml --validate
          "$artifact" config validate --config config-example.yaml --json
          "$artifact" worker --help
          "$artifact" job --help
          "$artifact" job list --config config-example.yaml --json
          "$artifact" gui --help
          port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          "$artifact" gui --config config-example.yaml --host 127.0.0.1 --port "$port" --no-browser > control-smoke.stdout.log 2> control-smoke.stderr.log &
          control_pid=$!
          cleanup_control() {
            if kill -0 "$control_pid" 2>/dev/null; then
              kill "$control_pid" 2>/dev/null || true
            fi
            wait "$control_pid" 2>/dev/null || true
          }
          trap cleanup_control EXIT
          if ! python .github/scripts/smoke_control.py "http://127.0.0.1:${port}/health" --timeout 60; then
            sed -n '1,200p' control-smoke.stdout.log
            sed -n '1,200p' control-smoke.stderr.log >&2
            exit 1
          fi
          cleanup_control
          trap - EXIT

      - name: Smoke packaged binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATAFLUX_TOKEN: packaged-control-smoke-token
        run: |
          $artifact = "dist\${{ matrix.artifact_name }}"
          & $artifact version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact process --config config-example.yaml --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact config validate --config config-example.yaml --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact worker --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact job --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact job list --config config-example.yaml --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $artifact gui --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $stdoutLog = "control-smoke.stdout.log"
          $stderrLog = "control-smoke.stderr.log"
          $control = Start-Process -FilePath $artifact -ArgumentList @("gui", "--config", "config-example.yaml", "--host", "127.0.0.1", "--port", "$port", "--no-browser") -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
          try {
            python .github/scripts/smoke_control.py "http://127.0.0.1:$port/health" --timeout 60
            if ($LASTEXITCODE -ne 0) {
              Get-Content $stdoutLog -ErrorAction SilentlyContinue
              Get-Content $stderrLog -ErrorAction SilentlyContinue | Write-Error
              exit $LASTEXITCODE
            }
          } finally {
            if (-not $control.HasExited) {
              Stop-Process -Id $control.Id -Force -ErrorAction SilentlyContinue
            }
            Wait-Process -Id $control.Id -ErrorAction SilentlyContinue
          }

      - name: Upload artifact               # 上传到 GitHub Artifacts，保留30天
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  # =========================================================================
  # 发布任务 — 仅在推送版本标签时触发
  # =========================================================================
  release:
    name: Create Release
    needs: build                           # 等待所有平台构建完成
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # 仅上述 SemVer 标签触发
    
    steps:
      - name: Download all artifacts       # 下载所有平台的构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display artifacts            # 列出所有下载的文件用于确认
        run: find artifacts/ -type f

      - name: Create GitHub Release        # 创建 Release 并上传所有构建产物
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }} (Nuitka)
          body: |
            ## ${{ env.APP_NAME }} ${{ github.ref_name }} (Nuitka Build)
            
            ### Downloads
            - **Linux (x64)**: `AI-DataFlux-nuitka-linux-amd64`
            - **Linux (ARM64)**: `AI-DataFlux-nuitka-linux-arm64`
            - **macOS (Apple Silicon)**: `AI-DataFlux-nuitka-macos-arm64`
            - **Windows (x64)**: `AI-DataFlux-nuitka-windows-amd64.exe`
            
            ### Build Info
            - Builder: Nuitka (compiled to native code)
            - Python: ${{ env.PYTHON_VERSION }}
            - Node.js: ${{ env.NODE_VERSION }}
            - Includes: Web GUI Control Panel
            
            ### Note
            Nuitka builds are compiled to native machine code, offering better startup time and runtime performance compared to PyInstaller bundles.
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
